name: Windows hook launch-parity smoke test

# Guards the Windows-support BLOCKER: on a fresh native Windows install, Claude Code
# launches every hook through a POSIX shell (Git Bash `sh`). If the installed command
# string can't launch, EVERY hook is silently dead — security pipeline, memory, context
# loading, all of it. This job proves that can never return unnoticed.
#
# The fixture is GENERATED, not committed: InstallSettings.ts + InstallHooks.ts run
# against a scratch config root exactly as they do on a user's machine, and the smoke
# test runs over their output. So this job covers the install path too — a hooks.json
# or settings.system.json change that yields an unlaunchable command fails here.
#
# No bun.exe shim: the payload wires bare `$HOME/.claude/hooks/X.hook.ts` and never
# emits a win32 interpreter prefix, so the commands launch via their shebang on Git
# Bash just as they do on Unix. (An earlier, retired installer DID rewrite commands to
# `"$HOME/.bun/bin/bun.exe" ...`, which is why a shim used to be staged here.)

on:
  push:
    paths:
      # The payload surfaces that decide what gets wired and whether it can launch.
      - "LifeOS/install/hooks/**"
      - "LifeOS/install/settings.system.json"
      - "LifeOS/Tools/Install*.ts"
      - "LifeOS/Tools/InstallEngine.ts"
      - "Tools/smoke-hook-launch.ts"
      - ".github/workflows/windows-smoke.yml"
  pull_request:
    paths:
      - "LifeOS/install/hooks/**"
      - "LifeOS/install/settings.system.json"
      - "LifeOS/Tools/Install*.ts"
      - "LifeOS/Tools/InstallEngine.ts"
      - "Tools/smoke-hook-launch.ts"
      - ".github/workflows/windows-smoke.yml"
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Prove the tool can go RED before trusting a green result — a smoke test that
      # cannot fail is theatre. Runs in Git Bash (present by default on windows-latest).
      - name: Self-test (tool must be able to fail)
        shell: bash
        run: bun Tools/smoke-hook-launch.ts --self-test

      # Generate the fixture with the payload's OWN installer tools, then launch every
      # wired hook. HOME is the scratch dir for BOTH steps: InstallSettings expands
      # leading $HOME in env values at write time, so it must see the same home the
      # launcher will expand $HOME to, or the fixture points outside the scratch tree.
      - name: Hook launch-parity smoke (installer-generated fixture)
        shell: bash
        run: |
          set -euo pipefail
          SCRATCH="$(mktemp -d)"
          mkdir -p "$SCRATCH/.claude"

          # settings.system.json → settings.json (env values expanded), then hooks.json
          # merged in. InstallHooks also copies the hooks/ tree into the config root, so
          # each wired `$HOME/.claude/hooks/X.hook.ts` resolves to a real file.
          HOME="$SCRATCH" bun LifeOS/Tools/InstallSettings.ts --config-root "$SCRATCH/.claude" --skill-root LifeOS --apply
          HOME="$SCRATCH" bun LifeOS/Tools/InstallHooks.ts    --config-root "$SCRATCH/.claude" --skill-root LifeOS --apply

          # Three wired commands point at $HOME/.claude/LIFEOS/TOOLS/*.ts. DeployCore would
          # stage these, but it also copies every skill and runs `bun install` in the config
          # root — minutes of CI for coverage this job does not claim. Copy just that tree.
          cp -r "$GITHUB_WORKSPACE/LifeOS/install/LIFEOS" "$SCRATCH/.claude/LIFEOS"

          echo "scratch HOME: $SCRATCH (installer-generated fixture, bun: $(command -v bun))"
          HOME="$SCRATCH" bun Tools/smoke-hook-launch.ts --settings "$SCRATCH/.claude/settings.json"
